<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Playbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playbook">
  <meta name="theme-color" content="#0F1412">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=0.8">
</head>
<body>
  <!-- ======================================================================
       LAYOUT PER COMPUTER, a tre colonne:
       [ elenco degli schemi ] [ campo da gioco ] [ pannello dettagli ]
       ====================================================================== -->
  <div class="app">

    <!-- ============ COLONNA 1: barra laterale con gli schemi ============ -->
    <aside class="laterale">
      <!-- La squadra del coach: logo e nome (clic per modificarli) -->
      <div class="laterale-testa">
        <button class="squadra" id="btn-squadra" title="Nome e logo della squadra">
          <span class="stemma" id="stemma"></span>
          <span class="squadra-testi">
            <span class="squadra-nome" id="squadra-nome">La tua squadra</span>
            <span class="squadra-sotto"><img src="icon-180.png" alt="">Playbook</span>
          </span>
        </button>
        <button id="btn-nuovo" class="btn-icona" title="Nuovo schema (N)" aria-label="Nuovo schema">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>

      <!-- Controllo segmentato: Attacco / Difesa -->
      <div class="segmentato" id="filtro-lato" data-scelto="attacco" role="tablist">
        <button class="segmento attivo" data-lato="attacco" role="tab">Attacco</button>
        <button class="segmento" data-lato="difesa" role="tab">Difesa</button>
      </div>

      <div class="cerca">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="cerca" type="search" placeholder="Cerca" autocomplete="off">
      </div>

      <p class="titolo-sezione" id="conteggio"></p>
      <ul class="lista" id="lista-schemi"></ul>
      <p class="lista-vuota" id="lista-vuota" hidden></p>

      <!-- Account in fondo alla barra -->
      <div class="account">
        <span class="account-icona">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5 19.5c1.4-3.2 4-4.8 7-4.8s5.6 1.6 7 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        </span>
        <span class="account-email" id="email-utente"></span>
        <span class="stato-sync" id="stato-sync" title=""></span>
        <button class="btn-link" id="btn-esci">Esci</button>
      </div>
      <p class="versione" id="versione">Versione 0.8</p>
    </aside>

    <!-- ============ COLONNA 2: il campo ============ -->
    <main class="centro">
      <!-- Mostrato quando nessuno schema è aperto -->
      <div class="vuoto" id="vuoto">
        <div class="vuoto-icona">🏈</div>
        <p class="vuoto-titolo">Nessuno schema aperto</p>
        <p class="vuoto-testo">Scegli uno schema a sinistra oppure creane uno nuovo.</p>
        <button class="btn-pieno" id="btn-nuovo-vuoto">Nuovo schema</button>
      </div>

      <div class="editor" id="editor" hidden>
        <header class="editor-testa">
          <div class="editor-titoli">
            <input id="nome-schema" class="nome-schema" type="text" maxlength="60" placeholder="Nome dello schema" autocomplete="off">
            <p class="sottotitolo"><span id="info-schema"></span> <span class="stato-salvataggio" id="stato-salvataggio"></span></p>
          </div>
          <!-- Strumenti: Lucchetto, Ribalta, Annulla, Ripeti -->
          <div class="gruppo-pulsanti">
            <button class="btn-strumento btn-lucchetto" id="btn-lucchetto" title="Blocca lo schema (L)">
              <svg class="icona-lucchetto" viewBox="0 0 24 24" width="18" height="18"><path class="arco" d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><rect class="corpo" x="5" y="11" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><circle class="foro" cx="12" cy="16" r="1.4" fill="currentColor"/></svg>
              <span class="testo-lucchetto">Blocca</span>
            </button>
            <span class="divisore"></span>
            <button class="btn-strumento" id="btn-ribalta" title="Ribalta destra/sinistra (R)">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3v18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2" fill="none"/><path d="M9 7L3 17h6zM15 7l6 10h-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
              Ribalta
            </button>
            <span class="divisore"></span>
            <button class="btn-strumento" id="btn-annulla" title="Annulla (Ctrl+Z)" aria-label="Annulla" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 14L4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            </button>
            <button class="btn-strumento" id="btn-ripeti" title="Ripeti (Ctrl+Shift+Z)" aria-label="Ripeti" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 14l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            </button>
          </div>
        </header>

        <!-- Il campo da gioco: disegnato in SVG da app.js -->
        <div class="campo-area">
          <div class="campo-cornice">
            <svg id="campo" class="campo" xmlns="http://www.w3.org/2000/svg"></svg>

            <!-- Campo vuoto: invito a scegliere o creare una formazione -->
            <div class="campo-vuoto" id="campo-vuoto" hidden>
              <p class="campo-vuoto-titolo" id="campo-vuoto-titolo">Campo libero</p>
              <p class="campo-vuoto-testo" id="campo-vuoto-testo"></p>
              <button class="btn-pieno" id="btn-crea-da-zero-campo">Crea da zero</button>
            </div>

            <!-- Lucchetto grande che compare quando blocchi/sblocchi -->
            <div class="sigillo" id="sigillo" aria-hidden="true"><svg class="icona-lucchetto" viewBox="0 0 24 24" width="110" height="110"><path class="arco" d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><rect class="corpo" x="5" y="11" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><circle class="foro" cx="12" cy="16" r="1.4" fill="currentColor"/></svg></div>
          </div>
        </div>

        <div class="legenda" id="legenda"></div>
        <p class="suggerimento" id="suggerimento"></p>
      </div>
    </main>

    <!-- ============ COLONNA 3: pannello dei dettagli ============ -->
    <aside class="pannello" id="pannello" hidden>
      <p class="titolo-sezione">Formazione</p>
      <div class="lista lista-scelte" id="lista-formazioni"></div>
      <!-- Tavolozza delle pedine per "Crea da zero" -->
      <div class="tavolozza" id="tavolozza" hidden></div>

      <p class="titolo-sezione">Giocatore selezionato</p>
      <div class="card info-giocatore" id="info-giocatore">
        <p class="testo-secondario">Clicca un giocatore sul campo.</p>
      </div>

      <p class="titolo-sezione">Note</p>
      <div class="card">
        <textarea id="note-schema" rows="6" placeholder="Chiamata, letture, compiti per ruolo…"></textarea>
      </div>

      <div class="card azioni-card">
        <button class="riga-azione" id="btn-duplica">Duplica schema <kbd id="kbd-duplica"></kbd></button>
        <button class="riga-azione distruttiva" id="btn-elimina">Elimina schema…</button>
      </div>
    </aside>
  </div>

  <!-- ======================================================================
       FINESTRA "LA TUA SQUADRA": nome e logo
       ====================================================================== -->
  <form class="dialogo dialogo-squadra" id="foglio-squadra" role="dialog" aria-modal="true" hidden>
    <p class="dialogo-titolo" id="titolo-squadra">La tua squadra</p>
    <p class="dialogo-testo" id="testo-squadra"></p>

    <label class="zona-logo" id="zona-logo">
      <input type="file" id="file-logo" accept="image/png,image/jpeg,application/pdf,.pdf" hidden>
      <img id="anteprima-logo" alt="Logo della squadra">
      <span class="zona-vuota">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 16V4M7 9l5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <b>Carica il logo</b>
        <span>Trascinalo qui o clicca · PNG, JPG o PDF</span>
      </span>
      <span class="zona-attesa">Preparo il logo…</span>
    </label>
    <button type="button" class="btn-link piccolo" id="btn-rimuovi-logo" hidden>Rimuovi logo</button>

    <label class="campo-testo">
      <span>Nome della squadra</span>
      <input id="nome-squadra" type="text" maxlength="40" placeholder="Es. Guelfi Firenze" autocomplete="organization">
    </label>
    <p class="messaggio-errore" id="errore-squadra"></p>

    <div class="dialogo-pulsanti">
      <button type="button" class="btn-secondario" id="btn-squadra-annulla">Annulla</button>
      <button type="submit" class="btn-pieno" id="btn-squadra-salva">Salva</button>
    </div>
  </form>

  <!-- ======================================================================
       INTRODUZIONE E ACCESSO
       ====================================================================== -->
  <div class="intro" id="intro">
    <div class="intro-campo" aria-hidden="true"></div>
    <div class="intro-centro">
      <!-- Marchio animato: una traccia che si disegna, attaccante e difensore -->
      <svg class="intro-marchio" viewBox="0 0 120 120" aria-hidden="true">
        <rect class="m-fondo" x="4" y="4" width="112" height="112" rx="26"/>
        <path class="m-linea" d="M4 40h112M4 70h112M4 100h112"/>
        <path class="m-traccia" d="M36 94V52h40"/>
        <path class="m-freccia" d="M74 42l12 10-12 10z"/>
        <circle class="m-attacco" cx="36" cy="94" r="10"/>
        <path class="m-difesa" d="M78 84l14 14M92 84l-14 14"/>
      </svg>
      <h1 class="intro-titolo">Playbook</h1>
      <p class="intro-motto">Disegna. Organizza. Vinci.</p>
    </div>

    <form class="accesso" id="accesso" hidden novalidate>
      <h2 id="accesso-titolo"></h2>
      <p class="accesso-testo" id="accesso-testo"></p>

      <div class="segmentato" id="accesso-schede" data-scelto="sinistra">
        <button type="button" class="segmento attivo" data-modo="accedi">Accedi</button>
        <button type="button" class="segmento" data-modo="registrati">Registrati</button>
      </div>

      <label class="campo-testo" id="campo-email">
        <span>Email</span>
        <input id="accesso-email" type="email" autocomplete="email" placeholder="coach@squadra.it">
      </label>
      <label class="campo-testo" id="campo-password">
        <span>Password</span>
        <input id="accesso-password" type="password" autocomplete="current-password" minlength="6" placeholder="Almeno 6 caratteri">
      </label>

      <p class="accesso-messaggio" id="accesso-messaggio" role="status"></p>
      <button type="submit" class="btn-pieno grande" id="accesso-invia">Accedi</button>
      <button type="button" class="btn-link" id="link-dimenticata">Password dimenticata?</button>
      <button type="button" class="btn-link" id="link-indietro" hidden>← Torna all'accesso</button>
    </form>
  </div>

  <!-- Finestra di conferma (stile macOS) -->
  <div class="velo" id="velo" hidden></div>
  <div class="dialogo" id="dialogo" role="dialog" aria-modal="true" hidden>
    <p class="dialogo-titolo" id="dialogo-titolo"></p>
    <p class="dialogo-testo" id="dialogo-testo"></p>
    <div class="dialogo-pulsanti">
      <button class="btn-secondario" id="dialogo-annulla">Annulla</button>
      <button class="btn-pieno distruttivo" id="dialogo-ok">Elimina</button>
    </div>
  </div>

  <!-- Menu delle tracce: compare cliccando un giocatore -->
  <div class="menu-tracce" id="menu-tracce" hidden></div>

  <!-- Avviso breve in basso (es. "Schema eliminato") -->
  <div class="toast" id="toast" hidden></div>

  <!-- Ordine importante: configurazione e librerie, poi i dati, poi l'interfaccia -->
  <script src="config.js?v=0.8"></script>
  <script src="lib/supabase.js"></script>
  <script src="formazioni.js?v=0.8"></script>
  <script src="cloud.js?v=0.8"></script>
  <script src="dati.js?v=0.8"></script>
  <script src="app.js?v=0.8"></script>
  <script src="tracce.js?v=0.8"></script>
  <script src="costruttore.js?v=0.8"></script>
  <script src="lucchetto.js?v=0.8"></script>
  <script src="squadra.js?v=0.8"></script>
  <script src="accesso.js?v=0.8"></script>
</body>
</html>
